/* Layout: phone-first single column with a bottom tab bar; on wide screens the tabs move to a top bar
   and kitchens sit in a two-column grid. Brand from the VenGuard Brand Guidelines.
   Here red / amber / green ARE the safety states (gas detected, attention, safe) and are used for nothing else. */
:root {
  --navy: #0B2A4A;
  --teal: #12B5A6;
  --teal-ink: #0A7F76;
  --bg: #EAF2F6;
  --card: #FFFFFF;
  --card-2: #F4F8FA;
  --ink: #0A1622;
  --muted: #5B6B7A;
  --line: #D5E2EA;
  --on-navy: #FFFFFF;
  --safe: #138A4B;     --safe-bg: #E3F4EA;
  --warn: #9A5B00;     --warn-bg: #FFF1D6;
  --danger: #B42318;   --danger-bg: #FDE7E5;
  --off: #5B6B7A;      --off-bg: #E9EEF2;
  --font: "Noto Sans Bengali", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-en: "Inter", "Noto Sans Bengali", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --navy: #DCE8F2; --bg: #06162A; --card: #0D2340; --card-2: #112A4B; --ink: #E8F0F5; --muted: #9DB0C0; --line: #1E3A5C; --on-navy: #06162A;
    --teal-ink: #4FD6C8; --safe: #5ED39A; --safe-bg: #0F3A2A; --warn: #F2B65A; --warn-bg: #3A2A0E; --danger: #FF8A80; --danger-bg: #44171A; --off: #9DB0C0; --off-bg: #1A3150;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --navy: #DCE8F2; --bg: #06162A; --card: #0D2340; --card-2: #112A4B; --ink: #E8F0F5; --muted: #9DB0C0; --line: #1E3A5C; --on-navy: #06162A;
  --teal-ink: #4FD6C8; --safe: #5ED39A; --safe-bg: #0F3A2A; --warn: #F2B65A; --warn-bg: #3A2A0E; --danger: #FF8A80; --danger-bg: #44171A; --off: #9DB0C0; --off-bg: #1A3150;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 var(--font); }
html[lang="en"] body { font-family: var(--font-en); line-height: 1.5; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); border-bottom: 1px solid var(--line); }
.top .in { max-width: 1040px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.logo { display: flex; align-items: center; gap: 8px; font: 800 1.15rem/1 var(--font-en); color: var(--navy); letter-spacing: -.01em; }
.logo svg { width: 26px; height: 26px; color: var(--navy); }
.logo small { font: 600 .72rem/1 var(--font-en); color: var(--teal-ink); border: 1px solid currentColor; padding: 2px 6px; border-radius: 999px; }
.tabs-top { display: none; margin-left: 24px; gap: 4px; }
.tabs-top button { all: unset; cursor: pointer; padding: 8px 12px; border-radius: 10px; font-weight: 600; color: var(--muted); }
.tabs-top button[aria-current="page"] { background: var(--card-2); color: var(--navy); }
.lang { margin-left: auto; display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; font-size: .88rem; }
.lang button { all: unset; cursor: pointer; padding: 5px 10px; }
.lang button[aria-pressed="true"] { background: var(--navy); color: var(--on-navy); }

main { max-width: 1040px; margin: 0 auto; padding-block: 16px 112px; padding-inline: 16px; }
h1 { font-size: 1.5rem; line-height: 1.3; margin: 4px 0 4px; color: var(--navy); text-wrap: balance; }
h2 { font-size: 1.1rem; margin: 0 0 10px; color: var(--navy); }
.lead { color: var(--muted); margin: 0 0 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.stack { display: grid; gap: 14px; }
.grid { display: grid; gap: 14px; }
@media (min-width: 760px) { .grid.two { grid-template-columns: 1fr 1fr; } }

/* bottom tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs button { all: unset; cursor: pointer; display: grid; justify-items: center; gap: 2px; padding: 9px 4px 10px; font-size: .78rem; font-weight: 600; color: var(--muted); position: relative; }
.tabs button svg { width: 24px; height: 24px; }
.tabs button[aria-current="page"] { color: var(--teal-ink); }
.tabs .badge { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--danger); color: #fff; font-size: .7rem; display: grid; place-items: center; padding: 0 5px; }
@media (min-width: 760px) { .tabs { display: none; } .tabs-top { display: flex; } main { padding-bottom: 48px; } }

/* status */
.state { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; padding: 6px 12px 6px 8px; border-radius: 999px; font-size: .95rem; }
.state svg { width: 20px; height: 20px; flex: none; }
.st-safe { color: var(--safe); background: var(--safe-bg); }
.st-warn { color: var(--warn); background: var(--warn-bg); }
.st-danger { color: var(--danger); background: var(--danger-bg); }
.st-off { color: var(--off); background: var(--off-bg); }

.kitchen { display: grid; gap: 12px; text-decoration: none; color: inherit; cursor: pointer; text-align: left; width: 100%; font: inherit; }
.kitchen:hover { border-color: var(--teal-ink); }
.kitchen.alarm { border: 2px solid var(--danger); }
.krow { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.kname { font-weight: 700; font-size: 1.1rem; color: var(--navy); }
.ksub { color: var(--muted); font-size: .9rem; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.fact { background: var(--card-2); border-radius: 12px; padding: 8px 10px; min-width: 0; }
.fact .l { font-size: .75rem; color: var(--muted); }
.fact .v { font-weight: 700; color: var(--navy); overflow-wrap: anywhere; }

/* device page */
.back { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--teal-ink); font-weight: 600; margin-bottom: 6px; }
.hero-state { display: grid; gap: 14px; }
.big-state { display: flex; align-items: center; gap: 14px; }
.big-state .ring { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.big-state .ring svg { width: 34px; height: 34px; }
.big-state h1 { margin: 0; }
.gauge { display: grid; gap: 6px; }
.gauge .bar { position: relative; height: 14px; background: var(--card-2); border-radius: 7px; overflow: hidden; }
.gauge .fill { position: absolute; inset: 0 auto 0 0; background: var(--teal-ink); border-radius: 0 7px 7px 0; transition: width .6s; }
.gauge .fill.hot { background: var(--danger); }
.gauge .mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.gauge .scale { display: flex; justify-content: space-between; font-size: .78rem; color: var(--muted); }

.close-btn { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 64px; border-radius: 16px; background: var(--navy); color: var(--on-navy); font-weight: 700; font-size: 1.1rem; position: relative; overflow: hidden; text-align: center; padding: 10px 16px; }
.close-btn svg { width: 24px; height: 24px; flex: none; }
.close-btn[disabled] { opacity: .55; cursor: not-allowed; }
.close-btn .hold { position: absolute; inset: 0 auto 0 0; width: 0; background: rgba(18,181,166,.45); }
.note { font-size: .9rem; color: var(--muted); }
.note strong { color: var(--ink); }
.cmd { border-radius: 14px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; }
.cmd svg { width: 22px; height: 22px; flex: none; margin-top: 2px; }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } .gauge .fill { transition: none; } }

.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
.timeline li:last-child { border-bottom: 0; }
.timeline svg { width: 22px; height: 22px; }
.timeline time { color: var(--muted); font-size: .82rem; white-space: nowrap; }

/* building */
.units { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.unit { all: unset; box-sizing: border-box; cursor: pointer; border-radius: 14px; padding: 12px; background: var(--card); border: 1px solid var(--line); display: grid; gap: 6px; }
.unit:hover { border-color: var(--teal-ink); }
.unit strong { color: var(--navy); }
.unit.alarm { border: 2px solid var(--danger); }
.unit .state { font-size: .8rem; padding: 3px 9px 3px 6px; }
.unit .state svg { width: 16px; height: 16px; }
.summary { display: flex; flex-wrap: wrap; gap: 8px; }

/* forms */
.btn { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 20px; border-radius: 999px; font-weight: 700; background: var(--teal-ink); color: #fff; text-align: center; }
:root[data-theme="dark"] .btn { color: #06162A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn { color: #06162A; } }
.btn.ghost { background: transparent; color: var(--navy); border: 1.5px solid var(--line); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
label.f { display: grid; gap: 6px; font-weight: 600; color: var(--navy); }
label.f input { font-weight: 400; color: var(--ink); min-height: 50px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); width: 100%; }
label.f .hint { font-weight: 400; color: var(--muted); font-size: .85rem; }
.err { color: var(--danger); font-weight: 600; font-size: .9rem; }
.contact { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.contact:last-child { border-bottom: 0; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: .9rem; }
.toggle input { width: 22px; height: 22px; accent-color: var(--teal-ink); }
.plan { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-block; font-size: .8rem; font-weight: 700; border-radius: 999px; padding: 2px 10px; background: var(--card-2); color: var(--navy); }

/* sheet (confirm) */
.scrim { position: fixed; inset: 0; background: rgba(4,14,28,.5); z-index: 30; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--card); border-radius: 22px 22px 0 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; max-width: 560px; margin: 0 auto; box-shadow: 0 -10px 30px rgba(4,14,28,.25); }
.sheet h2 { font-size: 1.25rem; margin: 0; }
.alarm-banner { background: var(--danger); color: #fff; border-radius: 16px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.alarm-banner svg { width: 26px; height: 26px; flex: none; }
.alarm-banner strong { display: block; font-size: 1.05rem; }
.demo { border: 1.5px dashed var(--teal-ink); border-radius: 14px; padding: 10px 14px; font-size: .9rem; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.demo .btn { min-height: 38px; padding: 6px 14px; font-size: .88rem; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--card); padding: 10px 16px; border-radius: 999px; z-index: 40; font-size: .92rem; max-width: calc(100% - 32px); text-align: center; }
.signin { max-width: 420px; margin: 24px auto 0; }
.signin .logo { font-size: 1.5rem; margin-bottom: 8px; }
</style>

  }

  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-go],[data-device],[data-building],[data-close],[data-cancel],[data-sim],[data-rm],[data-renew],[data-signout],[data-push],[data-lang]");
    if (!el) return;
    if (el.hasAttribute("data-lang")) return setLang(el.getAttribute("data-lang"));
    if (el.hasAttribute("data-go")) return go(el.getAttribute("data-go"));
    if (el.hasAttribute("data-device")) { S.device = el.getAttribute("data-device"); return go("device"); }
    if (el.hasAttribute("data-building")) { S.site = el.getAttribute("data-building"); return go("building"); }
    if (el.hasAttribute("data-close")) return confirmClose(el.getAttribute("data-close"));
    if (el.hasAttribute("data-cancel")) { $("#overlay").innerHTML = ""; var cb = $("#closeBtn"); if (cb) cb.focus(); return; }
    if (el.hasAttribute("data-sim")) { var a = el.getAttribute("data-sim"); DS[{ leak: "simulateLeak", reset: "simulateReset", offline: "toggleOffline" }[a]](S.device); if (a === "reset") S.cmd = null; return; }
    if (el.hasAttribute("data-rm")) { var p = el.getAttribute("data-rm").split(":"), s = site(p[0]); s.contacts.splice(+p[1], 1); DS.saveContacts(s.id, s.contacts).then(function () { toast(t("saved")); }); return render(); }
    if (el.hasAttribute("data-renew")) return DS.renew(el.getAttribute("data-renew")).catch(function (er) { toast(er.message); });
    if (el.hasAttribute("data-signout")) return DS.signOut().then(function () { S.user = null; S.signin = { step: "phone" }; render(); });
    if (el.hasAttribute("data-push")) { if ("Notification" in window) Notification.requestPermission().then(function () { render(); }).catch(function () {}); return; }
  });
  document.addEventListener("change", function (e) {
    var a = e.target.getAttribute("data-sms"); if (!a) return;
    var p = a.split(":"), s = site(p[0]); s.contacts[+p[1]].sms = e.target.checked; DS.saveContacts(s.id, s.contacts).then(function () { toast(t("saved")); });
  });
  document.addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target;
    if (f.id === "fPhone") {
      var ph = normPhone($("#inPhone").value); S.signin.phone = $("#inPhone").value;
      if (!ph) { S.signin.err = t("badPhone"); return render(); }
      DS.sendCode(ph).then(function () { S.signin = { step: "code", phone: ph }; render(); $("#inCode").focus(); }).catch(function (er) { S.signin.err = er.message; render(); });
    } else if (f.id === "fCode") {
      DS.verify($("#inCode").value.trim()).then(function (u) { S.user = { name: u.name, phone: String(u.phone).replace(/^\+88/, "") }; S.view = "home"; DS.subscribe(onData); render(); }).catch(function (er) { S.signin.err = er.message || t("badCode"); render(); });
    } else if (f.hasAttribute("data-add")) {
      var s = site(f.getAttribute("data-add")), nm = f.elements.name.value.trim(), pn = normPhone(f.elements.phone.value);
      if (!nm || !pn) return toast(t("badPhone"));
      if (s.contacts.length >= 3) return toast(t("max3"));
      s.contacts.push({ name: nm, phone: pn, sms: true }); DS.saveContacts(s.id, s.contacts).then(function () { toast(t("saved")); }); render();
    } else if (f.id === "fClaim") {
      DS.claimDevice($("#inDev").value.trim().toUpperCase(), $("#inClaim").value.trim()).then(function () { toast(t("saved")); }).catch(function (er) { toast(er.message); });
    }
  });
  function site(id) { return S.sites.filter(function (s) { return s.id === id; })[0]; }

  var lastAlarms = {};
  function onData(d) {
    S.sites = d.sites; S.devices = d.devices; S.events = d.events;
    // A new alarm pulls the person to that kitchen and buzzes the phone (if allowed).
    Object.keys(S.devices).forEach(function (k) {
      var a = S.devices[k].alarm;
      if (a && !lastAlarms[k]) { if (navigator.vibrate) try { navigator.vibrate([300, 150, 300]); } catch (e) {} if (S.view !== "device") { S.device = k; S.view = "device"; } }
      lastAlarms[k] = a;
    });
    // Close confirmed by the device state itself (covers a missed ack).
    if (S.cmd && S.cmd.state === "waiting" && S.devices[S.cmd.device] && S.devices[S.cmd.device].valve === "closed") { S.cmd.state = "done"; S.cmd.at = Date.now(); clearTimeout(S.cmd.timer); }
    // Don't redraw under someone who is typing; catch up when they leave the field.
    var ae = document.activeElement;
    if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && $("#main").contains(ae)) { S.pending = true; return; }
    var focusId = ae && ae.id; render(); if (focusId && $("#" + focusId)) $("#" + focusId).focus();
  }
  document.addEventListener("focusout", function () { setTimeout(function () { var ae = document.activeElement; if (S.pending && !(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))) { S.pending = false; render(); } }, 0); });

  setLang(S.lang);
  // Demo opens signed in so the first view shows what the app does.
  if (DS.demo) { S.user = { name: "Fatema", phone: "01712345678" }; DS.subscribe(onData); }
  else DS.restore(function (u) { S.user = u; S.view = "home"; DS.subscribe(onData); render(); });
})();
</script>
