<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VENGuard Dashboard Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            fire: {
              50: '#fff4ef',
              100: '#ffe4d7',
              200: '#ffc5a9',
              300: '#ff9f77',
              400: '#ff7a49',
              500: '#ff5b22',
              600: '#e34813',
              700: '#bc360b',
              800: '#8e2908',
              900: '#631d05'
            }
          },
          fontFamily: {
            onest: ['Onest', 'sans-serif'],
            inter: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: Inter, sans-serif;
      background: #0f0f12;
      color: #f5f5f5;
      overflow-x: hidden;
    }
    .glass-dark {
      background: rgba(18,18,24,0.76);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,.08);
    }
    .glass-light {
      background: rgba(255,255,255,.93);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,.52);
    }
    .grid-bg {
      background-image:
        linear-gradient(rgba(255,91,34,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,91,34,.03) 1px, transparent 1px);
      background-size: 42px 42px;
    }
    .glow-border {
      position: relative;
    }
    .glow-border::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(255,91,34,.48), transparent 35%, transparent 65%, rgba(255,91,34,.14));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { createRoot } = ReactDOM;

    const AlertTriangle = ({size=20, color='currentColor'}) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
    );

    const Lock = ({size=20, color='currentColor'}) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <rect width="18" height="11" x="3" y="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    );

    function Dashboard() {
      const [detectorOnline, setDetectorOnline] = useState(true);
      const [manualDrill, setManualDrill] = useState(false);
      const [highestGasReading, setHighestGasReading] = useState(66);
      const [highestSmokeReading, setHighestSmokeReading] = useState(12.1);
      const [gasThreshold] = useState(100);
      const [smokeThreshold] = useState(18);
      const [contactsNotified, setContactsNotified] = useState(3);
      const [alertAcknowledged, setAlertAcknowledged] = useState(false);
      const [bars, setBars] = useState(() => Array.from({ length: 30 }, () => 20 + Math.random() * 70));

      const gasExceeded = detectorOnline && highestGasReading >= gasThreshold;
      const smokeExceeded = detectorOnline && highestSmokeReading >= smokeThreshold;
      const fireAlert = detectorOnline && (manualDrill || gasExceeded || smokeExceeded);
      const allReadingsNormal = detectorOnline && !fireAlert;

      useEffect(() => {
        if (!detectorOnline) return;
        const interval = setInterval(() => {
          setHighestGasReading(prev => {
            const target = manualDrill ? gasThreshold + 18 + Math.random() * 35 : 52 + Math.random() * 24;
            return Math.round(prev * 0.68 + target * 0.32);
          });
          setHighestSmokeReading(prev => {
            const target = manualDrill ? smokeThreshold + 4 + Math.random() * 8 : 8 + Math.random() * 6;
            return parseFloat((prev * 0.72 + target * 0.28).toFixed(1));
          });
          setBars(Array.from({ length: 30 }, () => 20 + Math.random() * 70));
        }, 1300);
        return () => clearInterval(interval);
      }, [detectorOnline, manualDrill, gasThreshold, smokeThreshold]);

      const statusMessage = !detectorOnline
        ? 'Detector offline'
        : allReadingsNormal
          ? 'System normal'
          : 'Alert active';

      const locationDevices = [
        { location:'Main Kitchen', gas:highestGasReading, smoke:highestSmokeReading, status:fireAlert ? 'CRITICAL' : 'NORMAL', critical:fireAlert },
        { location:'Boiler Room', gas:Math.max(28, highestGasReading - 22), smoke:Math.max(4.2, highestSmokeReading - 5.6), status:'NORMAL', critical:false },
        { location:'Cylinder Storage', gas:Math.max(34, highestGasReading - 16), smoke:Math.max(5.8, highestSmokeReading - 4.1), status:'NORMAL', critical:false },
        { location:'Ventilation Shaft', gas:Math.max(18, highestGasReading - 38), smoke:Math.max(2.6, highestSmokeReading - 7.4), status:fireAlert ? 'PURGING' : 'STANDBY', critical:fireAlert },
      ];

      const timeline = [
        '02:14 Gas threshold exceeded',
        '02:14 Buzzer triggered',
        '02:14 Ventilation started',
        '02:14 Valve closed',
        '02:21 Alert acknowledged',
      ];

      return (
        <div className="min-h-screen bg-[#0f0f12] grid-bg px-4 py-6 md:px-6 md:py-8">
          <div className="max-w-7xl mx-auto space-y-6">
            <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
              <div>
                <div className="text-xs font-mono uppercase tracking-[0.2em] text-fire-400 mb-2">Live Dashboard</div>
                <h1 className="text-3xl md:text-4xl font-onest font-bold text-white">VENGuard Control Panel</h1>
                <p className="text-sm text-gray-400 mt-2">Live readings, alerts, and controls</p>
              </div>
              <div className="flex gap-3">
                <button onClick={() => setManualDrill(v => !v)} className="bg-fire-500 hover:bg-fire-400 text-white px-4 py-2.5 rounded-full text-xs font-semibold uppercase tracking-[0.18em]">
                  {manualDrill ? 'Stop Drill' : 'Test Alert'}
                </button>
                <button onClick={() => setDetectorOnline(v => !v)} className="border border-white/10 hover:border-fire-500/40 text-white px-4 py-2.5 rounded-full text-xs font-semibold uppercase tracking-[0.18em]">
                  {detectorOnline ? 'Detector On' : 'Detector Off'}
                </button>
              </div>
            </div>

            <div className={`rounded-2xl px-5 py-4 border font-onest font-bold text-sm ${fireAlert ? 'bg-fire-500/90 border-fire-300/40 text-white' : detectorOnline ? 'bg-emerald-600/90 border-emerald-300/30 text-white' : 'bg-gray-700/80 border-gray-500/30 text-gray-200'}`}>
              {statusMessage}
            </div>

            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
              {[
                ['Gas', `${highestGasReading} PPM`],
                ['Smoke', `${highestSmokeReading.toFixed(1)}%`],
                ['Alert', fireAlert ? 'ACTIVE' : 'CLEAR'],
                ['Contacts', `${contactsNotified}`],
              ].map(([label, value], i) => (
                <div key={i} className="glass-dark rounded-3xl p-5 glow-border">
                  <div className="text-[10px] font-mono uppercase tracking-[0.18em] text-gray-500 mb-2">{label}</div>
                  <div className="text-2xl font-onest font-bold text-white">{value}</div>
                </div>
              ))}
            </div>

            <div className="grid lg:grid-cols-12 gap-6">
              <div className="lg:col-span-7 glass-dark rounded-[2rem] p-6 glow-border">
                <div className="flex items-center justify-between mb-5">
                  <h2 className="text-xl font-onest font-bold text-white">Locations</h2>
                  <span className="text-xs font-mono uppercase tracking-[0.18em] text-gray-400">Live</span>
                </div>

                <div className="grid md:grid-cols-2 gap-4">
                  {locationDevices.map((device, i) => (
                    <div key={i} className={`rounded-3xl p-5 border ${device.critical ? 'bg-fire-500/10 border-fire-400/40' : 'bg-white/[0.03] border-white/10'}`}>
                      <div className="flex items-center justify-between mb-4">
                        <div className="font-onest font-semibold text-white">{device.location}</div>
                        <span className={`px-2.5 py-1 rounded-full text-[10px] font-mono font-bold ${device.critical ? 'bg-fire-500 text-white' : 'bg-emerald-500/15 text-emerald-300'}`}>
                          {device.status}
                        </span>
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                        <div className="rounded-2xl bg-black/25 border border-white/5 p-3">
                          <div className="text-[10px] font-mono uppercase tracking-wider text-gray-500">Gas</div>
                          <div className="font-onest text-xl font-bold text-white mt-1">{Math.round(device.gas)} PPM</div>
                        </div>
                        <div className="rounded-2xl bg-black/25 border border-white/5 p-3">
                          <div className="text-[10px] font-mono uppercase tracking-wider text-gray-500">Smoke</div>
                          <div className="font-onest text-xl font-bold text-white mt-1">{device.smoke.toFixed(1)}%</div>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="mt-6">
                  <div className="h-32 flex items-end gap-1.5">
                    {bars.map((h, i) => (
                      <div key={i} className="flex-1 rounded-t-sm bg-fire-500/70" style={{ height: `${h}%` }}></div>
                    ))}
                  </div>
                </div>
              </div>

              <div className="lg:col-span-5 space-y-6">
                <div className="glass-light rounded-[2rem] p-6 text-gray-900">
                  <div className="flex items-center justify-between mb-5">
                    <h2 className="text-xl font-onest font-bold">Actions</h2>
                    <AlertTriangle size={18} color="#ff5b22" />
                  </div>

                  <div className="space-y-3">
                    <button className="w-full rounded-2xl bg-fire-500 hover:bg-fire-400 text-white px-4 py-4 font-onest font-semibold text-left">
                      Start Ventilation
                    </button>
                    <button className="w-full rounded-2xl bg-[#19191f] hover:bg-[#202029] text-white px-4 py-4 font-onest font-semibold border border-white/10 text-left">
                      Emergency Shutoff
                    </button>
                    <button onClick={() => setAlertAcknowledged(true)} className="w-full rounded-2xl bg-gray-100 hover:bg-gray-200 text-gray-900 px-4 py-4 font-onest font-semibold text-left">
                      Acknowledge Alert
                    </button>
                    <button onClick={() => setContactsNotified(c => c + 1)} className="w-full rounded-2xl bg-gray-100 hover:bg-gray-200 text-gray-900 px-4 py-4 font-onest font-semibold text-left">
                      Notify Contact
                    </button>
                  </div>

                  <div className="grid grid-cols-3 gap-3 mt-5 text-center text-xs">
                    <div className="rounded-2xl bg-black/[0.03] p-3">
                      <div className="text-gray-500 uppercase tracking-[0.15em] mb-1">Alert</div>
                      <div className={`font-onest font-bold ${alertAcknowledged ? 'text-emerald-600' : 'text-amber-600'}`}>
                        {alertAcknowledged ? 'SEEN' : 'PENDING'}
                      </div>
                    </div>
                    <div className="rounded-2xl bg-black/[0.03] p-3">
                      <div className="text-gray-500 uppercase tracking-[0.15em] mb-1">Valve</div>
                      <div className="font-onest font-bold text-red-600">CLOSED</div>
                    </div>
                    <div className="rounded-2xl bg-black/[0.03] p-3">
                      <div className="text-gray-500 uppercase tracking-[0.15em] mb-1">Vent</div>
                      <div className="font-onest font-bold text-emerald-600">READY</div>
                    </div>
                  </div>
                </div>

                <div className="glass-dark rounded-[2rem] p-6 glow-border">
                  <div className="flex items-center gap-3 mb-4">
                    <Lock size={18} color="#ff5b22" />
                    <h2 className="text-xl font-onest font-bold text-white">Restore Lock</h2>
                  </div>
                  <div className="rounded-2xl bg-fire-500/10 border border-fire-500/20 p-4">
                    <div className="text-fire-300 font-onest font-semibold">Manual restore required</div>
                  </div>
                </div>

                <div className="glass-dark rounded-[2rem] p-6 glow-border">
                  <h2 className="text-xl font-onest font-bold text-white mb-4">Timeline</h2>
                  <div className="space-y-3">
                    {timeline.map((item, i) => (
                      <div key={i} className="flex items-start gap-3">
                        <div className="w-2.5 h-2.5 rounded-full bg-fire-500 mt-1.5"></div>
                        <div className="text-sm text-gray-300">{item}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    createRoot(document.getElementById('root')).render(<Dashboard />);
  </script>
</body>
</html>
